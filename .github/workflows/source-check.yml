name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public source boundaries
        shell: pwsh
        run: python tools_release/prepare_source.py --check
      - name: Check Python bridge syntax
        shell: pwsh
        run: python -m compileall -q native/bridge dualpc src
